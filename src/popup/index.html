<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Warpkey</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span id="esc-hint" class="corner-hint">Esc to close</span>
      <h1>Warpkey</h1>
      <p id="host"></p>
      <p id="leader-row">
        Leader key: <kbd id="leader-key" tabindex="0" role="button"></kbd>
        <span id="leader-hint" class="hint"></span>
      </p>
    </header>
    <button id="record">Record new binding</button>
    <ul id="global-shortcuts">
      <li>
        <kbd class="g-leader"></kbd><kbd>r</kbd>
        <span class="label">Record new binding</span>
      </li>
    </ul>
    <ul id="bindings"></ul>
  </body>
  <script type="module" src="main.ts"></script>
</html>
