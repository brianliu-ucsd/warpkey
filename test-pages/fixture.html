<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Warpkey test fixture</title>
    <style>
      body { font: 14px system-ui; padding: 24px; max-width: 640px; }
      button, [role="button"] { display: block; margin: 10px 0; padding: 6px 10px; cursor: pointer; }
      .count { font-weight: bold; }
      input { display: block; margin: 10px 0; padding: 6px; width: 300px; }
      section { margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <h1>Warpkey test fixture</h1>
    <p>Static page with known DOM structure for repeatable manual test flows. See docs/verification.md.</p>

    <section>
      <button data-testid="warpkey-testid-button" onclick="bump('testid')">
        TestID-tier button - clicks: <span class="count" id="count-testid">0</span>
      </button>

      <button id="warpkey-id-button" onclick="bump('id')">
        ID-tier button (no data-testid) - clicks: <span class="count" id="count-id">0</span>
      </button>

      <div role="button" tabindex="0" aria-label="Aria label button" onclick="bump('aria')">
        Aria-tier target (no id/data-testid) - clicks: <span class="count" id="count-aria">0</span>
      </div>

      <span onclick="bump('structural')" style="text-decoration: underline;">
        Structural-tier target (no id/data-testid/role/aria-label) - clicks: <span class="count" id="count-structural">0</span>
      </span>
    </section>

    <section>
      <input type="text" id="focus-target" placeholder="Focus-action target / editable-field guard" />
    </section>

    <script>
      function bump(key) {
        const el = document.getElementById("count-" + key);
        el.textContent = String(Number(el.textContent) + 1);
      }
    </script>
  </body>
</html>
